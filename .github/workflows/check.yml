name: Validate lecture notes
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python algebra_lab.py --output validation/algebra-results.json
      - run: python tools/geometry.py
      - run: python tools/build.py
      - run: python tools/test_validation.py
      - run: python tools/browser_check.py --chromium
      - run: python tools/validate.py --output validation/package-results.json
